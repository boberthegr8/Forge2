name: Forge Home Portal Nav

on:
  push:
    branches:
      - feature/portal-live-nav

permissions:
  contents: write

jobs:
  patch-home:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote Portal links
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old_nav = '<div class="disabled"><span class="navicon">PT</span>Portal <span style="margin-left:auto;font-size:8px">NEXT</span></div>'
          new_nav = '<a href="https://forge-portal-pi.vercel.app"><span class="navicon">PT</span>Portal</a>'
          old_card = '<div class="module" style="opacity:.55"><div class="moduletop"><div class="modulebadge">PTL</div><span class="live soon">Next</span></div><h4>Portal</h4><p>Secure customer/dealer project visibility, documents and approvals.</p></div>'
          new_card = '<a class="module" href="https://forge-portal-pi.vercel.app"><div class="moduletop"><div class="modulebadge">PTL</div><span class="live">Live</span></div><h4>Portal</h4><p>Secure customer/dealer project visibility, documents and approvals.</p><span class="arrow">↗</span></a>'
          if s.count(old_nav) != 1:
              raise SystemExit(f'Expected one Portal nav placeholder, found {s.count(old_nav)}')
          if s.count(old_card) != 1:
              raise SystemExit(f'Expected one Portal module placeholder, found {s.count(old_card)}')
          s = s.replace(old_nav, new_nav).replace(old_card, new_card)
          p.write_text(s)
          PY
      - name: Commit Portal link
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Promote Portal to live Forge Home module"
          git push
