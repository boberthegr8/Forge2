<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forge — Sign in</title><meta name="theme-color" content="#111216"><link rel="stylesheet" href="/account.css"></head>
<body class="splash">
<main class="splash-wrap">
  <form id="login" class="splash-card" hidden autocomplete="on">
    <h1>Forge</h1>
    <p class="splash-sub">Owner access</p>
    <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required autofocus aria-label="Password">
    <button class="primary" id="go" type="submit">Sign in</button>
    <p id="notice" role="status" aria-live="polite"></p>
  </form>
  <p id="checking" class="splash-sub">Checking your session…</p>
</main>
<script type="module" src="/account.js"></script>
</body></html>
